[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-morphology"
version = "0.1.0"
description = "Documented non-parametric galaxy morphology extraction"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "pyarrow>=14", "astropy>=5", "matplotlib>=3.7", "Markdown>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["algorithmic_morphology*"]
